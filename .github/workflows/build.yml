name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64
        run: |
          dotnet publish DualPaneHost/DualPaneHost.csproj -c Release -r win-x64 -o publish /p:PublishSingleFile=true /p:SelfContained=false
        shell: pwsh

      - name: Copy config
        run: |
          Copy-Item dualpane.json publish/dualpane.json -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualpane-win-x64
          path: publish/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DualPaneHost.exe
            publish/dualpane.json
          generate_release_notes: false
          body: |
            DSH Dual Pane - 一个窗口内两列 WebView2（左 DSH 对话 / 右历史注入）
            用法：解压后编辑 dualpane.json 改 URL，双击 DualPaneHost.exe
